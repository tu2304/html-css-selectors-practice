<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Bộ chọn Element (h1) -->
        <h1 id="main-title">Trang web của tôi</h1>

        <!-- Bộ chọn Class (.intro-text) -->
        <p class="intro-text">Xin chào, tôi là một lập trình viên đang học tập và phát triển các ứng dụng web với HTML và CSS.</p>

        <!-- Bộ chọn Element (ul, li) -->
        <h2>Sở thích cá nhân</h2>
        <ul class="hobby-list">
            <li class="hobby-item">Đọc sách công nghệ</li>
            <li class="hobby-item">Chơi thể thao</li>
            <li class="hobby-item">Lập trình ứng dụng</li>
        </ul>

        <!-- Bộ chọn Element kết hợp Pseudo-class (:hover) -->
        <div class="btn-container">
            <button class="action-btn">Nhấn vào đây</button>
        </div>
    </div>

</body>
</html>
